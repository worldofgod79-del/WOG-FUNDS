<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WOG Funds</title><link rel="stylesheet" href="style.css">
</head><body>
<header><div><b>WOG</b><small>WORLD OF GOD • FUNDS</small></div></header>
<main>
<section class="hero"><span>FINANCE DASHBOARD</span><h1>WOG Funds</h1><p>Donations • Expenses • History</p></section>
<section class="cards"><div><small>Total Donations</small><strong id="donations">₹0</strong></div><div><small>Total Expenses</small><strong id="expenses">₹0</strong></div><div><small>Available Balance</small><strong id="balance">₹0</strong></div></section>
<nav><button class="active" data-page="home">Dashboard</button><button data-page="donation">Donation</button><button data-page="expense">Expense</button><button data-page="history">History</button></nav>

<section id="home" class="page active"><h2>Recent Transactions</h2><div id="recent"></div></section>

<section id="donation" class="page"><h2>Add Donation</h2><form id="donationForm">
<input name="date" type="date" required><input name="donor_name" placeholder="Donor name" required>
<input name="amount" type="number" min="0" step=".01" placeholder="Amount ₹" required>
<select name="payment_mode"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Other</option></select>
<input name="purpose" placeholder="Purpose"><input name="reference" placeholder="Transaction / reference ID">
<textarea name="remarks" placeholder="Remarks"></textarea><button>Save Donation</button></form></section>

<section id="expense" class="page"><h2>Add Expense</h2><form id="expenseForm">
<input name="date" type="date" required><input name="description" placeholder="Expense description" required>
<input name="amount" type="number" min="0" step=".01" placeholder="Amount ₹" required>
<select name="category"><option>Ministry</option><option>Events</option><option>Media</option><option>Travel</option><option>Equipment</option><option>Other</option></select>
<textarea name="remarks" placeholder="Remarks"></textarea><button>Save Expense</button></form></section>

<section id="history" class="page"><h2>Permanent History</h2>
<div class="filters"><input id="search" placeholder="Search..."><select id="filter"><option value="all">All</option><option value="donation">Donations</option><option value="expense">Expenses</option></select></div>
<div id="historyList"></div></section>
</main><footer>WORLD OF GOD • WOG Funds</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
